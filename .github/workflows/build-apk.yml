name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Install Dependencies
        run: npm install

      - name: Force-Create Android Platform
        # This tells Capacitor that your index.html is inside app/www
        run: npx cap add android --web-dir app/www

      - name: Sync Web Files
        run: npx cap sync android --web-dir app/www

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DesiNetwork-Final-Build
          path: android/app/build/outputs/apk/debug/app-debug.apk
